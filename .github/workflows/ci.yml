name: NEXUS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and local HTTP tests (no real AI or Wazuh calls)
        run: python -B -m unittest discover -s tests -q
      - name: JavaScript syntax
        run: node --check src/nexus/web/app.js
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('Start-NEXUS.ps1', 'Start-NEXUS-Tunnel.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
